<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Card</title>
    <link rel="stylesheet" href="Scenario3-StudentResultCard.css">
</head>
<body>

    <h2>Class Result Sheet</h2>

    <button id="generateBtn">
        Generate Results
    </button>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Total (300)</th>
                <th>Percentage</th>
                <th>Grade</th>
                <th>Result</th>
            </tr>
        </thead>

        <tbody id="resultBody">
        </tbody>
    </table>

    <div id="summary"></div>

    <script src="Scenario3-StudentResultCard.js"></script>
</body>
</html>
