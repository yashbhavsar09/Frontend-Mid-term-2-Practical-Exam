<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Meter</title>
    <link rel="stylesheet" href="Scenario4-PasswordStrengthMeter.css">
</head>
<body>

    <div class="container">

        <h2>Password Strength</h2>

        <input type="password"
               id="password"
               placeholder="Enter Password">

        <br>

        <input type="checkbox" id="showPassword">
        <label for="showPassword">Show password</label>

        <p id="strengthText"></p>

        <div class="bar">
            <div id="strengthBar"></div>
        </div>

        <h4>Password Rules:</h4>

        <div id="rule1" class="rule invalid">
            At least 8 characters
        </div>

        <div id="rule2" class="rule invalid">
            One uppercase letter
        </div>

        <div id="rule3" class="rule invalid">
            One lowercase letter
        </div>

        <div id="rule4" class="rule invalid">
            One number
        </div>

        <div id="rule5" class="rule invalid">
            One special symbol (!@#$)
        </div>

    </div>

    <script src="Scenario4-PasswordStrengthMeter.js"></script>
</body>
</html>
